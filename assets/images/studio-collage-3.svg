<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="cyber-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF5EB"/>
      <stop offset="100%" stop-color="#FFE7D6"/>
    </linearGradient>
    <linearGradient id="cyber-screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1736"/>
      <stop offset="100%" stop-color="#2D245A"/>
    </linearGradient>
    <linearGradient id="neon-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF5C8A"/>
      <stop offset="50%" stop-color="#35C9FF"/>
      <stop offset="100%" stop-color="#48D597"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#242044"/>
    </filter>
  </defs>

  <!-- Studio Exhibition Wall -->
  <rect width="600" height="450" fill="url(#cyber-wall)"/>

  <!-- Hanging Exhibition Bunting Banner -->
  <path d="M0 40 Q300 70 600 40" stroke="#242044" stroke-width="3" fill="none"/>
  <polygon points="60,45 85,90 110,48" fill="#35C9FF" stroke="#242044" stroke-width="2"/>
  <polygon points="140,54 165,98 190,56" fill="#FF5C8A" stroke="#242044" stroke-width="2"/>
  <polygon points="220,60 245,102 270,61" fill="#FFD93D" stroke="#242044" stroke-width="2"/>
  <polygon points="310,61 335,103 360,60" fill="#48D597" stroke="#242044" stroke-width="2"/>
  <polygon points="400,58 425,100 450,55" fill="#A66CFF" stroke="#242044" stroke-width="2"/>
  <polygon points="490,48 515,92 540,44" fill="#FF8A3D" stroke="#242044" stroke-width="2"/>

  <!-- Exhibition Wooden Floor -->
  <rect y="290" width="600" height="160" fill="#E8D2BF" stroke="#242044" stroke-width="4"/>
  <line x1="120" y1="290" x2="80" y2="450" stroke="#242044" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="280" y1="290" x2="250" y2="450" stroke="#242044" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="450" y1="290" x2="430" y2="450" stroke="#242044" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Center Exhibition Pedestal Station -->
  <g transform="translate(140, 100)">
    <!-- Pedestal Base -->
    <rect x="20" y="180" width="280" height="70" rx="10" fill="#FFFFFF" stroke="#242044" stroke-width="4" filter="url(#cardShadow)"/>
    <rect x="40" y="195" width="240" height="14" rx="4" fill="url(#neon-glow)"/>
    
    <!-- Neon Interactive Touchscreen Kiosk Display -->
    <rect x="40" y="0" width="240" height="180" rx="16" fill="#242044" stroke="#242044" stroke-width="4" filter="url(#cardShadow)"/>
    <!-- Glass Screen -->
    <rect x="52" y="12" width="216" height="140" rx="10" fill="url(#cyber-screen)"/>
    <!-- Grid overlay on screen -->
    <line x1="52" y1="60" x2="268" y2="60" stroke="#4C3D88" stroke-width="1" opacity="0.5"/>
    <line x1="52" y1="110" x2="268" y2="110" stroke="#4C3D88" stroke-width="1" opacity="0.5"/>
    <line x1="120" y1="12" x2="120" y2="152" stroke="#4C3D88" stroke-width="1" opacity="0.5"/>
    <line x1="200" y1="12" x2="200" y2="152" stroke="#4C3D88" stroke-width="1" opacity="0.5"/>

    <!-- Student Sci-Fi Artwork on Screen (Cute Cosmic Robot & Rocket) -->
    <!-- Distant Stars -->
    <circle cx="80" cy="35" r="3" fill="#FFD93D"/>
    <circle cx="235" cy="40" r="3.5" fill="#35C9FF"/>
    <circle cx="245" cy="120" r="2.5" fill="#FF5C8A"/>
    
    <!-- Cute Robot Astronaut Character -->
    <g transform="translate(160, 80)">
      <!-- Antenna -->
      <line x1="0" y1="-32" x2="0" y2="-20" stroke="#FFD93D" stroke-width="3"/>
      <circle cx="0" cy="-35" r="5" fill="#FF5C8A"/>
      <!-- Head -->
      <rect x="-24" y="-20" width="48" height="34" rx="8" fill="#35C9FF" stroke="#FFFFFF" stroke-width="2.5"/>
      <!-- Visor -->
      <rect x="-18" y="-14" width="36" height="16" rx="5" fill="#1B1736"/>
      <!-- Glowing Eyes -->
      <circle cx="-8" cy="-6" r="3.5" fill="#48D597"/>
      <circle cx="8" cy="-6" r="3.5" fill="#48D597"/>
      <!-- Smile -->
      <path d="M-4 0 Q0 3 4 0" stroke="#FFD93D" stroke-width="1.5" fill="none"/>
      <!-- Body -->
      <rect x="-18" y="16" width="36" height="26" rx="6" fill="#FFFFFF" stroke="#242044" stroke-width="2"/>
      <circle cx="0" cy="28" r="6" fill="#FF5C8A"/>
    </g>

    <!-- Rocket Sprite beside robot -->
    <g transform="translate(90, 95) rotate(-25)">
      <polygon points="0,-18 -10,10 10,10" fill="#FF5C8A" stroke="#FFFFFF" stroke-width="1.5"/>
      <rect x="-10" y="10" width="20" height="16" fill="#FFFFFF"/>
      <circle cx="0" cy="18" r="4" fill="#35C9FF"/>
      <polygon points="-5,26 0,36 5,26" fill="#FFD93D"/>
    </g>

    <!-- Kiosk Controls: Arcade Joystick & Glowing Buttons -->
    <g transform="translate(160, 220)">
      <!-- Joystick -->
      <ellipse cx="-70" cy="6" rx="14" ry="7" fill="#242044"/>
      <line x1="-70" y1="6" x2="-65" y2="-16" stroke="#C084FC" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-65" cy="-20" r="8" fill="#FF5C8A" stroke="#242044" stroke-width="2"/>
      
      <!-- Arcade Action Buttons -->
      <circle cx="-15" cy="0" r="7" fill="#FFD93D" stroke="#242044" stroke-width="2"/>
      <circle cx="5" cy="-8" r="7" fill="#48D597" stroke="#242044" stroke-width="2"/>
      <circle cx="25" cy="0" r="7" fill="#35C9FF" stroke="#242044" stroke-width="2"/>
      <circle cx="45" cy="-8" r="7" fill="#A66CFF" stroke="#242044" stroke-width="2"/>
    </g>
  </g>

  <!-- Left Side: Exhibition Plaque & First Place Golden Star Trophy -->
  <g transform="translate(30, 240)">
    <!-- Trophy Base -->
    <rect x="25" y="60" width="50" height="24" rx="4" fill="#242044"/>
    <rect x="35" y="46" width="30" height="14" rx="2" fill="#D48B59"/>
    <!-- Trophy Cup -->
    <path d="M30 15 C30 44, 70 44, 70 15 Z" fill="#FFD93D" stroke="#242044" stroke-width="3"/>
    <path d="M30 22 C18 22, 18 36, 30 36" fill="none" stroke="#242044" stroke-width="3"/>
    <path d="M70 22 C82 22, 82 36, 70 36" fill="none" stroke="#242044" stroke-width="3"/>
    <polygon points="50,18 53,26 61,26 55,31 57,39 50,34 43,39 45,31 39,26 47,26" fill="#FF5C8A"/>
  </g>

  <!-- Right Side: Digital Drawing Tablet with Stylus -->
  <g transform="translate(455, 230) rotate(8)">
    <rect x="0" y="0" width="105" height="75" rx="8" fill="#FFFFFF" stroke="#242044" stroke-width="3.5" filter="url(#cardShadow)"/>
    <rect x="8" y="8" width="89" height="59" rx="5" fill="#E0F7FA"/>
    <!-- Drawing on tablet: Rainbow swirl -->
    <path d="M15 50 Q45 20 85 40" stroke="#FF5C8A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M20 56 Q50 26 88 46" stroke="#35C9FF" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- Apple Stylus Pen resting -->
    <rect x="30" y="-12" width="70" height="7" rx="3.5" fill="#FFFFFF" stroke="#242044" stroke-width="2" transform="rotate(-35 65 -8)"/>
    <polygon points="34,10 28,14 36,16" fill="#FFD93D" stroke="#242044" stroke-width="1.5"/>
  </g>

  <!-- Floating Sparkles & Pixels -->
  <circle cx="80" cy="140" r="6" fill="#FF5C8A"/>
  <circle cx="520" cy="150" r="7" fill="#FFD93D"/>
  <polygon points="460,110 464,118 472,118 466,123 468,131 460,126 452,131 454,123 448,118 456,118" fill="#35C9FF"/>
</svg>
