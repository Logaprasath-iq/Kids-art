<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bg-play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FFE3EC"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background -->
  <rect width="400" height="240" fill="url(#bg-play)"/>
  <circle cx="60" cy="50" r="70" fill="#FFCCD9" opacity="0.4"/>
  <circle cx="340" cy="180" r="85" fill="#FFE082" opacity="0.4"/>

  <!-- Playful Paper Base Sheet -->
  <rect x="40" y="25" width="320" height="180" rx="16" fill="#FFFFFF" stroke="#242044" stroke-width="4"/>

  <!-- Coral Pink Left Handprint -->
  <g transform="translate(90, 55) rotate(-10)">
    <!-- Palm -->
    <ellipse cx="35" cy="60" rx="24" ry="26" fill="#FF5C8A"/>
    <!-- Thumb -->
    <ellipse cx="8" cy="50" rx="7" ry="14" fill="#FF5C8A" transform="rotate(-35 8 50)"/>
    <!-- Fingers -->
    <ellipse cx="20" cy="22" rx="6.5" ry="17" fill="#FF5C8A" transform="rotate(-10 20 22)"/>
    <ellipse cx="36" cy="16" rx="6.5" ry="19" fill="#FF5C8A"/>
    <ellipse cx="52" cy="20" rx="6.5" ry="18" fill="#FF5C8A" transform="rotate(10 52 20)"/>
    <ellipse cx="65" cy="30" rx="6" ry="15" fill="#FF5C8A" transform="rotate(25 65 30)"/>
  </g>

  <!-- Sunny Yellow Right Handprint -->
  <g transform="translate(230, 60) rotate(12)">
    <!-- Palm -->
    <ellipse cx="35" cy="60" rx="24" ry="26" fill="#FFD93D"/>
    <!-- Thumb -->
    <ellipse cx="62" cy="50" rx="7" ry="14" fill="#FFD93D" transform="rotate(35 62 50)"/>
    <!-- Fingers -->
    <ellipse cx="50" cy="22" rx="6.5" ry="17" fill="#FFD93D" transform="rotate(10 50 22)"/>
    <ellipse cx="34" cy="16" rx="6.5" ry="19" fill="#FFD93D"/>
    <ellipse cx="18" cy="20" rx="6.5" ry="18" fill="#FFD93D" transform="rotate(-10 18 20)"/>
    <ellipse cx="5" cy="30" rx="6" ry="15" fill="#FFD93D" transform="rotate(-25 5 30)"/>
  </g>

  <!-- Squeezed Paint Tube (Bottom Left) -->
  <g transform="translate(60, 155) rotate(18)">
    <path d="M0 8 L38 2 L42 22 L0 16 Z" fill="#38B6FF" stroke="#242044" stroke-width="2.5"/>
    <rect x="38" y="5" width="8" height="14" rx="2" fill="#242044"/>
    <!-- Squeezed swirl of blue paint -->
    <path d="M48 12 Q65 6 72 16 Q80 24 95 18" stroke="#38B6FF" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Star Sponge Stamp (Bottom Right) -->
  <g transform="translate(290, 140)">
    <!-- Sponge handle -->
    <rect x="18" y="0" width="14" height="22" rx="4" fill="#F59E0B" stroke="#242044" stroke-width="2.5"/>
    <!-- Sponge Star Head -->
    <polygon points="25,18 31,32 46,33 34,42 38,56 25,48 12,56 16,42 4,33 19,32" fill="#10B981" stroke="#242044" stroke-width="2.5"/>
    <!-- Yellow paint on tip -->
    <circle cx="25" cy="36" r="6" fill="#FFD93D"/>
  </g>

  <!-- Tactile Splashes & Bubble Dots -->
  <circle cx="195" cy="75" r="8" fill="#48D597"/>
  <circle cx="180" cy="120" r="10" fill="#A855F7"/>
  <circle cx="210" cy="135" r="6" fill="#FF5C8A"/>
  <circle cx="190" cy="155" r="7" fill="#38B6FF"/>
</svg>