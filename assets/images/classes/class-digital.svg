<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="bg-digital" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B1736"/>
      <stop offset="100%" stop-color="#2D245A"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="color-wheel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5C8A"/>
      <stop offset="33%" stop-color="#FFD93D"/>
      <stop offset="66%" stop-color="#38B6FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed dark digital art background -->
  <rect width="400" height="240" fill="url(#bg-digital)"/>
  
  <!-- Cyberpunk glowing grid -->
  <line x1="0" y1="80" x2="400" y2="80" stroke="#4C3D88" stroke-width="1.5" opacity="0.4"/>
  <line x1="0" y1="160" x2="400" y2="160" stroke="#4C3D88" stroke-width="1.5" opacity="0.4"/>
  <line x1="100" y1="0" x2="100" y2="240" stroke="#4C3D88" stroke-width="1.5" opacity="0.4"/>
  <line x1="200" y1="0" x2="200" y2="240" stroke="#4C3D88" stroke-width="1.5" opacity="0.4"/>
  <line x1="300" y1="0" x2="300" y2="240" stroke="#4C3D88" stroke-width="1.5" opacity="0.4"/>

  <!-- Neon ambient glow circles -->
  <circle cx="200" cy="115" r="95" fill="#6C63FF" opacity="0.25"/>
  <circle cx="70" cy="60" r="50" fill="#FF5C8A" opacity="0.2"/>

  <!-- Sleek iPad Pro Tablet (Center) -->
  <g transform="translate(85, 25)">
    <!-- Tablet Stand shadow -->
    <ellipse cx="115" cy="190" rx="90" ry="12" fill="#0C0A1A" opacity="0.6"/>
    <!-- Tablet Outer Shell -->
    <rect x="0" y="0" width="230" height="165" rx="18" fill="#1E293B" stroke="#64748B" stroke-width="3.5"/>
    <!-- Tablet Screen Glass -->
    <rect x="10" y="10" width="210" height="145" rx="10" fill="url(#screen-grad)"/>

    <!-- Screen UI: Procreate Header -->
    <rect x="18" y="18" width="55" height="10" rx="5" fill="#475569"/>
    <circle cx="85" cy="23" r="4" fill="#38B6FF"/>
    <circle cx="97" cy="23" r="4" fill="#FF5C8A"/>
    <circle cx="109" cy="23" r="4" fill="#FFD93D"/>

    <!-- Circular Color Palette Picker (Top Right) -->
    <circle cx="192" cy="30" r="12" fill="url(#color-wheel)"/>
    <circle cx="192" cy="30" r="6" fill="#0F172A"/>

    <!-- Glowing 2D Game Character Artwork on Screen -->
    <g transform="translate(105, 88)">
      <!-- Monster/Hero body -->
      <ellipse cx="0" cy="0" rx="34" ry="30" fill="#A855F7"/>
      <!-- Soft belly highlight -->
      <ellipse cx="0" cy="6" rx="20" ry="16" fill="#C084FC"/>
      <!-- Glowing Eyes -->
      <ellipse cx="-12" cy="-6" rx="7" ry="9" fill="#FFFFFF"/>
      <ellipse cx="12" cy="-6" rx="7" ry="9" fill="#FFFFFF"/>
      <circle cx="-10" cy="-6" r="4" fill="#38B6FF"/>
      <circle cx="14" cy="-6" r="4" fill="#38B6FF"/>
      <circle cx="-12" cy="-8" r="1.5" fill="#FFFFFF"/>
      <circle cx="12" cy="-8" r="1.5" fill="#FFFFFF"/>
      <!-- Cute smile -->
      <path d="M-6 8 Q0 14 6 8" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <!-- Cute antennae with glowing orbs -->
      <path d="M-15 -28 Q-12 -38 -20 -44" stroke="#A855F7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="-20" cy="-44" r="5" fill="#F43F5E"/>
      <path d="M15 -28 Q12 -38 20 -44" stroke="#A855F7" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="20" cy="-44" r="5" fill="#F43F5E"/>
    </g>

    <!-- Layers UI Box (Bottom Right) -->
    <rect x="155" y="105" width="55" height="40" rx="4" fill="#1E293B" opacity="0.85" stroke="#475569" stroke-width="1.5"/>
    <rect x="160" y="112" width="45" height="6" rx="2" fill="#38B6FF"/>
    <rect x="160" y="122" width="45" height="6" rx="2" fill="#64748B"/>
    <rect x="160" y="132" width="45" height="6" rx="2" fill="#64748B"/>
  </g>

  <!-- Apple Pencil / Digital Stylus (Angled on Right) -->
  <g transform="translate(290, 95) rotate(-35)">
    <rect x="0" y="0" width="115" height="9" rx="4.5" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
    <!-- Stylus tip -->
    <polygon points="0,0 -16,4.5 0,9" fill="#E2E8F0" stroke="#0F172A" stroke-width="1.5"/>
    <polygon points="-16,4.5 -10,2 -10,7" fill="#38B6FF"/>
    <!-- Metallic charging band -->
    <rect x="100" y="0" width="6" height="9" fill="#CBD5E1"/>
    <!-- Glowing light stroke from pen tip -->
    <path d="M-18 4.5 Q-30 0 -45 10" stroke="#38B6FF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Glowing Digital Sparkles -->
  <polygon points="45,40 48,46 54,48 48,50 45,56 42,50 36,48 42,46" fill="#38B6FF"/>
  <polygon points="345,180 348,186 354,188 348,190 345,196 342,190 336,188 342,186" fill="#FF5C8A"/>
</svg>