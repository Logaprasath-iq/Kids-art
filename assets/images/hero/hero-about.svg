<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="50%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFF9E9"/>
    </linearGradient>
    <linearGradient id="aboutWindow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="100%" stop-color="#B2EBF2"/>
    </linearGradient>
    <linearGradient id="canvasArt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5C8A"/>
      <stop offset="35%" stop-color="#FFD93D"/>
      <stop offset="70%" stop-color="#48D597"/>
      <stop offset="100%" stop-color="#35C9FF"/>
    </linearGradient>
    <linearGradient id="woodEasel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E8A87C"/>
      <stop offset="100%" stop-color="#D48B59"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#242044"/>
    </filter>
  </defs>

  <!-- Studio Wall Background -->
  <rect width="600" height="380" fill="url(#aboutSky)"/>
  
  <!-- Studio Wood Floor -->
  <rect y="300" width="600" height="80" fill="#F3D5B5" stroke="#242044" stroke-width="3"/>
  <line x1="120" y1="300" x2="80" y2="380" stroke="#242044" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="280" y1="300" x2="250" y2="380" stroke="#242044" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="440" y1="300" x2="420" y2="380" stroke="#242044" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Arched Studio Window -->
  <path d="M 60 200 L 60 90 A 60 60 0 0 1 180 90 L 180 200 Z" fill="url(#aboutWindow)" stroke="#242044" stroke-width="3"/>
  <line x1="120" y1="30" x2="120" y2="200" stroke="#242044" stroke-width="3"/>
  <line x1="60" y1="120" x2="180" y2="120" stroke="#242044" stroke-width="3"/>
  <!-- Sunbeams outside window -->
  <circle cx="120" cy="80" r="24" fill="#FFD93D" stroke="#242044" stroke-width="2"/>
  <path d="M 80 150 Q 100 135 120 150 T 160 150" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Colorful Bunting Garland -->
  <path d="M 20 25 Q 300 65 580 25" fill="none" stroke="#242044" stroke-width="2.5"/>
  <polygon points="60,33 85,36 72,65" fill="#FF5C8A" stroke="#242044" stroke-width="2"/>
  <polygon points="120,40 145,43 132,72" fill="#35C9FF" stroke="#242044" stroke-width="2"/>
  <polygon points="180,47 205,49 192,78" fill="#FFD93D" stroke="#242044" stroke-width="2"/>
  <polygon points="240,51 265,52 252,82" fill="#48D597" stroke="#242044" stroke-width="2"/>
  <polygon points="300,53 325,52 312,83" fill="#A66CFF" stroke="#242044" stroke-width="2"/>
  <polygon points="360,51 385,49 372,80" fill="#FF8A3D" stroke="#242044" stroke-width="2"/>
  <polygon points="420,46 445,43 432,74" fill="#FF5C8A" stroke="#242044" stroke-width="2"/>
  <polygon points="480,39 505,36 492,67" fill="#35C9FF" stroke="#242044" stroke-width="2"/>
  <polygon points="540,30 565,26 552,58" fill="#FFD93D" stroke="#242044" stroke-width="2"/>

  <!-- Wall Art Shelf -->
  <rect x="380" y="90" width="180" height="12" rx="4" fill="#E8A87C" stroke="#242044" stroke-width="3" filter="url(#shadow)"/>
  <!-- Mini Clay Pot 1 -->
  <path d="M 400 90 L 405 65 L 425 65 L 430 90 Z" fill="#FF8A3D" stroke="#242044" stroke-width="2.5"/>
  <!-- Mini Cactus Plant -->
  <rect x="445" y="70" width="22" height="20" rx="4" fill="#48D597" stroke="#242044" stroke-width="2"/>
  <circle cx="456" cy="62" r="7" fill="#48D597" stroke="#242044" stroke-width="2"/>
  <circle cx="448" cy="66" r="4" fill="#48D597" stroke="#242044" stroke-width="1.5"/>
  <circle cx="464" cy="66" r="4" fill="#48D597" stroke="#242044" stroke-width="1.5"/>
  <rect x="442" y="80" width="28" height="10" rx="2" fill="#FFE0B2" stroke="#242044" stroke-width="2"/>
  <!-- Framed Mini Sketch -->
  <rect x="490" y="45" width="45" height="45" rx="5" fill="#FFFFFF" stroke="#242044" stroke-width="3"/>
  <circle cx="512" cy="65" r="12" fill="#FF7EB6"/>
  <path d="M 500 78 L 525 78" stroke="#242044" stroke-width="2"/>

  <!-- Main Wooden Studio Easel (Center Left) -->
  <!-- Back leg -->
  <line x1="280" y1="80" x2="315" y2="330" stroke="#B87333" stroke-width="8" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="275" y1="70" x2="190" y2="330" stroke="url(#woodEasel)" stroke-width="9" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="285" y1="70" x2="360" y2="330" stroke="url(#woodEasel)" stroke-width="9" stroke-linecap="round"/>
  <!-- Crossbar shelf -->
  <rect x="180" y="240" width="190" height="14" rx="4" fill="#D48B59" stroke="#242044" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Canvas Artwork (The Masterpiece) -->
  <rect x="195" y="105" width="160" height="140" rx="8" fill="#FFFFFF" stroke="#242044" stroke-width="3.5" filter="url(#shadow)"/>
  <rect x="205" y="115" width="140" height="120" rx="6" fill="url(#canvasArt)"/>
  <!-- Art Motif: Smiling Sun and Creative Mountains -->
  <circle cx="275" cy="145" r="22" fill="#FFFFFF" opacity="0.9"/>
  <path d="M 215 220 L 255 170 L 290 205 L 320 180 L 340 220 Z" fill="#242044" opacity="0.8"/>
  <circle cx="240" cy="135" r="4" fill="#FFFFFF"/>
  <circle cx="310" cy="130" r="3" fill="#FFFFFF"/>
  <!-- Washi Tape on Canvas Top -->
  <rect x="255" y="98" width="40" height="14" rx="2" fill="#FFD93D" stroke="#242044" stroke-width="1.5" transform="rotate(-3 275 105)"/>

  <!-- Artist Palette on Stool -->
  <ellipse cx="430" cy="275" rx="55" ry="32" fill="#F4A261" stroke="#242044" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="460" cy="278" r="9" fill="#F3D5B5" stroke="#242044" stroke-width="2.5"/>
  <!-- Color Blobs on Palette -->
  <circle cx="400" cy="265" r="8" fill="#FF5C8A"/>
  <circle cx="418" cy="256" r="8" fill="#FFD93D"/>
  <circle cx="438" cy="258" r="8" fill="#35C9FF"/>
  <circle cx="456" cy="265" r="8" fill="#48D597"/>
  <circle cx="410" cy="285" r="8" fill="#A66CFF"/>
  
  <!-- Water Jar with Brushes -->
  <rect x="375" y="270" width="32" height="42" rx="6" fill="#E0F7FA" stroke="#242044" stroke-width="3" filter="url(#shadow)"/>
  <rect x="378" y="285" width="26" height="24" rx="3" fill="#80DEEA" opacity="0.7"/>
  <!-- Brushes standing in jar -->
  <line x1="391" y1="285" x2="382" y2="235" stroke="#8D6E63" stroke-width="4" stroke-linecap="round"/>
  <polygon points="382,235 378,220 386,220" fill="#FF5C8A"/>
  <line x1="395" y1="285" x2="402" y2="230" stroke="#8D6E63" stroke-width="4.5" stroke-linecap="round"/>
  <polygon points="402,230 398,214 406,214" fill="#35C9FF"/>
  <line x1="388" y1="285" x2="372" y2="245" stroke="#D7CCC8" stroke-width="3.5" stroke-linecap="round"/>
  <polygon points="372,245 368,232 376,232" fill="#48D597"/>

  <!-- Paint Splatters & Joyful Details -->
  <circle cx="150" cy="290" r="5" fill="#FF5C8A"/>
  <circle cx="160" cy="296" r="3" fill="#FF5C8A"/>
  <circle cx="360" cy="335" r="6" fill="#35C9FF"/>
  <circle cx="490" cy="325" r="5" fill="#FFD93D"/>
  <circle cx="475" cy="335" r="3" fill="#FFD93D"/>

  <!-- Little Canvas Badge Stamp -->
  <g transform="translate(480, 20) rotate(8)">
    <rect width="90" height="34" rx="17" fill="#FF5C8A" stroke="#242044" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="45" y="22" font-family="'Fredoka', cursive, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">EST. 2018</text>
  </g>
</svg>
