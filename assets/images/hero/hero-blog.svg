<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="blogSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF3E0"/>
      <stop offset="50%" stop-color="#FFE0B2"/>
      <stop offset="100%" stop-color="#FFF9E9"/>
    </linearGradient>
    <linearGradient id="bookCover1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF5C8A"/>
      <stop offset="100%" stop-color="#FF7EB6"/>
    </linearGradient>
    <linearGradient id="bookCover2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#35C9FF"/>
      <stop offset="100%" stop-color="#6C63FF"/>
    </linearGradient>
    <linearGradient id="bookCover3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FF8A3D"/>
    </linearGradient>
    <linearGradient id="lampGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF9E9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFD93D" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadowBlog" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#242044"/>
    </filter>
  </defs>

  <!-- Studio Wall Background -->
  <rect width="600" height="380" fill="url(#blogSky)"/>
  
  <!-- Studio Desk Surface -->
  <rect y="290" width="600" height="90" fill="#F3D5B5" stroke="#242044" stroke-width="3"/>
  <line x1="140" y1="290" x2="100" y2="380" stroke="#242044" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="320" y1="290" x2="290" y2="380" stroke="#242044" stroke-width="2" stroke-opacity="0.3"/>
  <line x1="480" y1="290" x2="460" y2="380" stroke="#242044" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Hanging Desk Lamp -->
  <path d="M 120 0 L 120 70" stroke="#242044" stroke-width="3"/>
  <path d="M 85 105 L 120 70 L 155 105 Z" fill="#FF8A3D" stroke="#242044" stroke-width="3" filter="url(#shadowBlog)"/>
  <ellipse cx="120" cy="105" rx="35" ry="10" fill="#FFD93D" stroke="#242044" stroke-width="2.5"/>
  <polygon points="85,110 30,300 210,300 155,110" fill="url(#lampGlow)" opacity="0.35"/>

  <!-- Floating Inspiration / Notes Board on Wall -->
  <rect x="220" y="30" width="160" height="100" rx="8" fill="#FFFFFF" stroke="#242044" stroke-width="3" filter="url(#shadowBlog)"/>
  <rect x="235" y="45" width="40" height="35" rx="3" fill="#FFE0B2" stroke="#242044" stroke-width="1.5" transform="rotate(-5 255 62)"/>
  <rect x="290" y="42" width="42" height="38" rx="3" fill="#E0F7FA" stroke="#242044" stroke-width="1.5" transform="rotate(4 311 61)"/>
  <rect x="250" y="85" width="100" height="30" rx="4" fill="#F4F1FD" stroke="#242044" stroke-width="1.5"/>
  <line x1="260" y1="95" x2="330" y2="95" stroke="#A5A0C2" stroke-width="2" stroke-linecap="round"/>
  <line x1="260" y1="102" x2="310" y2="102" stroke="#A5A0C2" stroke-width="2" stroke-linecap="round"/>
  <circle cx="255" cy="46" r="4" fill="#FF5C8A" stroke="#242044" stroke-width="1.5"/>
  <circle cx="310" cy="43" r="4" fill="#48D597" stroke="#242044" stroke-width="1.5"/>

  <!-- Stack of Colorful Art & Pedagogical Books (Left) -->
  <rect x="50" y="260" width="110" height="28" rx="4" fill="url(#bookCover1)" stroke="#242044" stroke-width="3" filter="url(#shadowBlog)"/>
  <rect x="58" y="235" width="98" height="26" rx="4" fill="url(#bookCover2)" stroke="#242044" stroke-width="3" filter="url(#shadowBlog)"/>
  <rect x="65" y="212" width="86" height="24" rx="4" fill="url(#bookCover3)" stroke="#242044" stroke-width="3" filter="url(#shadowBlog)"/>
  <line x1="62" y1="264" x2="62" y2="284" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="70" y1="239" x2="70" y2="257" stroke="#FFFFFF" stroke-width="2"/>
  <line x1="76" y1="216" x2="76" y2="232" stroke="#242044" stroke-width="2"/>

  <!-- Ceramic Mug with Paintbrush & Pencil (Left) -->
  <rect x="175" y="230" width="40" height="58" rx="8" fill="#FFFFFF" stroke="#242044" stroke-width="3" filter="url(#shadowBlog)"/>
  <path d="M 215 242 C 228 242, 228 266, 215 266" fill="none" stroke="#242044" stroke-width="3"/>
  <line x1="185" y1="245" x2="205" y2="245" stroke="#FF5C8A" stroke-width="4" stroke-linecap="round"/>
  <line x1="190" y1="240" x2="182" y2="185" stroke="#E8A87C" stroke-width="5" stroke-linecap="round"/>
  <path d="M 182 185 L 178 165 C 182 168, 186 168, 186 185 Z" fill="#35C9FF" stroke="#242044" stroke-width="1.5"/>
  <line x1="200" y1="240" x2="210" y2="190" stroke="#FFD93D" stroke-width="4" stroke-linecap="round"/>
  <polygon points="210,190 213,178 215,190" fill="#242044"/>

  <!-- Centerpiece: Open Creative Journal / Sketchbook -->
  <path d="M 230 230 C 270 225, 305 228, 320 235 L 320 305 C 305 298, 270 295, 230 300 Z" fill="#FFFFFF" stroke="#242044" stroke-width="3" filter="url(#shadowBlog)"/>
  <path d="M 410 230 C 370 225, 335 228, 320 235 L 320 305 C 335 298, 370 295, 410 300 Z" fill="#FFF9E9" stroke="#242044" stroke-width="3" filter="url(#shadowBlog)"/>
  <line x1="320" y1="234" x2="320" y2="305" stroke="#242044" stroke-width="3"/>
  <path d="M 245 270 Q 265 248 285 270" fill="none" stroke="#FF5C8A" stroke-width="3"/>
  <path d="M 248 274 Q 265 254 282 274" fill="none" stroke="#FFD93D" stroke-width="3"/>
  <path d="M 251 278 Q 265 260 279 278" fill="none" stroke="#48D597" stroke-width="3"/>
  <circle cx="295" cy="255" r="7" fill="#FFD93D" stroke="#242044" stroke-width="1.5"/>
  <line x1="250" y1="288" x2="300" y2="288" stroke="#A5A0C2" stroke-width="2" stroke-linecap="round"/>
  <line x1="335" y1="250" x2="395" y2="250" stroke="#716C88" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="335" y1="260" x2="395" y2="260" stroke="#716C88" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="335" y1="270" x2="385" y2="270" stroke="#716C88" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="335" y1="280" x2="392" y2="280" stroke="#716C88" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="335" y1="290" x2="370" y2="290" stroke="#716C88" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Reading Glasses resting across the journal -->
  <circle cx="345" cy="225" r="14" fill="none" stroke="#242044" stroke-width="2.5"/>
  <circle cx="375" cy="225" r="14" fill="none" stroke="#242044" stroke-width="2.5"/>
  <path d="M 359 224 Q 360 220 361 224" fill="none" stroke="#242044" stroke-width="2.5"/>
  <line x1="331" y1="225" x2="315" y2="218" stroke="#242044" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="389" y1="225" x2="405" y2="218" stroke="#242044" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right Side: Potted Plant & Creative Spark -->
  <path d="M 480 290 L 488 245 L 528 245 L 536 290 Z" fill="#FF5C8A" stroke="#242044" stroke-width="3" filter="url(#shadowBlog)"/>
  <path d="M 508 245 C 500 200, 465 190, 460 200 C 465 220, 490 230, 508 245 Z" fill="#48D597" stroke="#242044" stroke-width="2"/>
  <path d="M 508 245 C 515 190, 550 180, 555 195 C 545 215, 525 230, 508 245 Z" fill="#35C9FF" stroke="#242044" stroke-width="2"/>
  <path d="M 508 245 C 508 180, 505 170, 510 165 C 515 175, 512 215, 508 245 Z" fill="#FFD93D" stroke="#242044" stroke-width="2"/>

  <!-- Floating Sparkles / Ideas -->
  <path d="M 445 100 Q 455 100 455 90 Q 455 100 465 100 Q 455 100 455 110 Q 455 100 445 100" fill="#FFD93D"/>
  <path d="M 180 120 Q 188 120 188 112 Q 188 120 196 120 Q 188 120 188 128 Q 188 120 180 120" fill="#FF5C8A"/>
  <path d="M 480 60 Q 486 60 486 54 Q 486 60 492 60 Q 486 60 486 66 Q 486 60 480 60" fill="#35C9FF"/>
</svg>
