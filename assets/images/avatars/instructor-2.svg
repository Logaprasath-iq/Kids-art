<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <clipPath id="avatar-clip-2">
      <circle cx="80" cy="80" r="74"/>
    </clipPath>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8E5FF"/>
      <stop offset="100%" stop-color="#CCD5FF"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#avatar-clip-2)">
    <!-- Background -->
    <rect width="160" height="160" fill="url(#bg-grad-2)"/>
    <circle cx="130" cy="40" r="20" fill="#B3BFFF" opacity="0.4"/>
    <circle cx="30" cy="120" r="24" fill="#B3BFFF" opacity="0.3"/>

    <!-- Torso / Cool Hoodie -->
    <path d="M26 160 Q30 125 54 116 L106 116 Q130 125 134 160 Z" fill="#4B39EF"/>
    <!-- Hoodie Strings & Neckline -->
    <path d="M66 116 L80 134 L94 116 Z" fill="#242044" opacity="0.2"/>
    <path d="M72 126 L72 148" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M88 126 L88 148" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Headphones around neck -->
    <path d="M48 112 Q80 128 112 112" stroke="#FF5C8A" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="42" y="102" width="12" height="18" rx="6" fill="#242044"/>
    <rect x="106" y="102" width="12" height="18" rx="6" fill="#242044"/>

    <!-- Neck -->
    <rect x="71" y="96" width="18" height="22" rx="8" fill="#F4C7A3"/>

    <!-- Head -->
    <ellipse cx="80" cy="74" rx="28" ry="32" fill="#FCD9BD"/>
    <!-- Ears -->
    <ellipse cx="50" cy="74" rx="5" ry="7" fill="#FCD9BD"/>
    <ellipse cx="110" cy="74" rx="5" ry="7" fill="#FCD9BD"/>

    <!-- Hair Back/Sides -->
    <path d="M48 68 Q46 44 80 40 Q114 44 112 68 Z" fill="#242044"/>

    <!-- Face Details -->
    <!-- Eyebrows -->
    <path d="M60 63 L72 61" stroke="#242044" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M88 61 L100 63" stroke="#242044" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Eyes -->
    <ellipse cx="66" cy="69" rx="3.5" ry="4" fill="#242044"/>
    <ellipse cx="94" cy="69" rx="3.5" ry="4" fill="#242044"/>
    <circle cx="67.5" cy="67.5" r="1.2" fill="#FFFFFF"/>
    <circle cx="95.5" cy="67.5" r="1.2" fill="#FFFFFF"/>

    <!-- Modern Rectangular Glasses -->
    <rect x="55" y="61" width="22" height="16" rx="4" fill="none" stroke="#242044" stroke-width="2.5"/>
    <rect x="83" y="61" width="22" height="16" rx="4" fill="none" stroke="#242044" stroke-width="2.5"/>
    <line x1="77" y1="68" x2="83" y2="68" stroke="#242044" stroke-width="2.5"/>

    <!-- Nose -->
    <path d="M80 72 L82 78 L78 79" stroke="#DB9F73" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Confident Smile -->
    <path d="M72 86 Q80 93 88 86" stroke="#242044" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Modern Quiff Hair (layered front volume) -->
    <path d="M48 55 Q56 28 84 32 Q108 35 112 50 Q98 42 78 44 Q58 45 48 55 Z" fill="#242044"/>
    <!-- Stylus / Apple pencil behind ear -->
    <path d="M106 62 L118 42" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M116 45 L118 42" stroke="#FFD93D" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Outer Outline Circle -->
  <circle cx="80" cy="80" r="74" fill="none" stroke="#242044" stroke-width="5"/>
</svg>