    <path d="M60 62 Q66 58 72 61" stroke="#3D2010" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M88 61 Q94 58 100 62" stroke="#3D2010" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Big warm expressive eyes -->
