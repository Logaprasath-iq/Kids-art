<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="wall-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF9EF"/>
      <stop offset="100%" stop-color="#FFEED4"/>
    </linearGradient>
    <linearGradient id="window-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#E0F2FE"/>
    </linearGradient>
  </defs>

  <!-- Studio Wall Background -->
  <rect width="600" height="450" fill="url(#wall-grad)"/>

  <!-- Large Sunlit Studio Windows (Arched) -->
  <g transform="translate(60, 40)">
    <!-- Window 1 -->
    <path d="M0 60 Q0 0 65 0 Q130 0 130 60 L130 180 L0 180 Z" fill="url(#window-sky)" stroke="#242044" stroke-width="5"/>
    <line x1="65" y1="0" x2="65" y2="180" stroke="#242044" stroke-width="4"/>
    <line x1="0" y1="90" x2="130" y2="90" stroke="#242044" stroke-width="4"/>
    <!-- Window 2 -->
    <path d="M180 60 Q180 0 245 0 Q310 0 310 60 L310 180 L180 180 Z" fill="url(#window-sky)" stroke="#242044" stroke-width="5"/>
    <line x1="245" y1="0" x2="245" y2="180" stroke="#242044" stroke-width="4"/>
    <line x1="180" y1="90" x2="310" y2="90" stroke="#242044" stroke-width="4"/>
    <!-- Window 3 -->
    <path d="M360 60 Q360 0 425 0 Q490 0 490 60 L490 180 L360 180 Z" fill="url(#window-sky)" stroke="#242044" stroke-width="5"/>
    <line x1="425" y1="0" x2="425" y2="180" stroke="#242044" stroke-width="4"/>
    <line x1="360" y1="90" x2="490" y2="90" stroke="#242044" stroke-width="4"/>
  </g>

  <!-- Colorful Hanging Bunting Garland across Studio -->
  <path d="M0 45 Q150 95 300 65 Q450 95 600 45" stroke="#242044" stroke-width="3" fill="none"/>
  <polygon points="60,62 85,105 110,68" fill="#FF5C8A"/>
  <polygon points="140,73 165,115 190,78" fill="#FFD93D"/>
  <polygon points="220,77 245,118 270,75" fill="#38B6FF"/>
  <polygon points="310,72 335,114 360,78" fill="#48D597"/>
  <polygon points="400,80 425,120 450,76" fill="#A855F7"/>
  <polygon points="490,68 515,108 540,60" fill="#FF8A3D"/>

  <!-- Shelves with Clay Vases & Artwork (Right Wall) -->
  <rect x="490" y="140" width="105" height="12" rx="3" fill="#D28C56" stroke="#242044" stroke-width="3"/>
  <path d="M510 140 C 505 115, 535 115, 530 140 Z" fill="#FF8A3D" stroke="#242044" stroke-width="2.5"/>
  <rect x="545" y="115" width="22" height="25" rx="3" fill="#38B6FF" stroke="#242044" stroke-width="2.5"/>

  <!-- Studio Floor -->
  <rect y="290" width="600" height="160" fill="#E8D2BF"/>
  <line x1="0" y1="290" x2="600" y2="290" stroke="#242044" stroke-width="5"/>

  <!-- Student Easels in Foreground -->
  <!-- Left Easel -->
  <g transform="translate(110, 170)">
    <path d="M20 220 L65 50 L110 220" stroke="#B47242" stroke-width="8" stroke-linecap="round"/>
    <rect x="0" y="60" width="130" height="105" rx="8" fill="#FFFFFF" stroke="#242044" stroke-width="4"/>
    <!-- Kid's Colorful Painting -->
    <rect x="8" y="68" width="114" height="89" rx="4" fill="#FEF08A"/>
    <circle cx="65" cy="105" r="28" fill="#FF5C8A"/>
    <circle cx="65" cy="105" r="14" fill="#FFD93D"/>
    <path d="M15 155 Q65 125 115 155" stroke="#10B981" stroke-width="12" fill="none"/>
  </g>

  <!-- Center Kids Maker Table with Stools -->
  <g transform="translate(260, 260)">
    <rect x="0" y="20" width="220" height="22" rx="6" fill="#F59E0B" stroke="#242044" stroke-width="4"/>
    <rect x="25" y="42" width="12" height="75" rx="3" fill="#B45309" stroke="#242044" stroke-width="3"/>
    <rect x="185" y="42" width="12" height="75" rx="3" fill="#B45309" stroke="#242044" stroke-width="3"/>
    <!-- Paint Pots on Table -->
    <rect x="40" y="2" width="20" height="20" rx="4" fill="#FF5C8A" stroke="#242044" stroke-width="2.5"/>
    <rect x="70" y="2" width="20" height="20" rx="4" fill="#38B6FF" stroke="#242044" stroke-width="2.5"/>
    <rect x="100" y="2" width="20" height="20" rx="4" fill="#FFD93D" stroke="#242044" stroke-width="2.5"/>
    <rect x="130" y="2" width="20" height="20" rx="4" fill="#48D597" stroke="#242044" stroke-width="2.5"/>
    <!-- Brushes in Pot -->
    <rect x="165" y="-5" width="25" height="26" rx="4" fill="#CBD5E1" stroke="#242044" stroke-width="2.5"/>
    <path d="M172 -4 L165 -22" stroke="#B45309" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M182 -4 L185 -25" stroke="#B45309" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>