<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="500" height="600">
  <defs>
    <linearGradient id="bg-auth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8ED"/>
      <stop offset="100%" stop-color="#FFE7CE"/>
    </linearGradient>
  </defs>

  <rect width="500" height="600" fill="url(#bg-auth)"/>
  <circle cx="250" cy="200" r="170" fill="#FF5C8A" opacity="0.15"/>
  <circle cx="400" cy="420" r="140" fill="#35C9FF" opacity="0.18"/>
  <circle cx="100" cy="440" r="120" fill="#FFD93D" opacity="0.2"/>

  <!-- Central Illustrated Art Canvas Frame -->
  <rect x="70" y="70" width="360" height="460" rx="28" fill="#FFFFFF" stroke="#242044" stroke-width="6"/>

  <!-- Artist Palette in Center -->
  <g transform="translate(140, 115)">
    <!-- Palette Wood -->
    <path d="M40 70 C 40 20, 170 10, 210 50 C 245 85, 230 155, 190 165 C 160 172, 150 145, 120 145 C 90 145, 80 175, 50 165 C 20 155, 40 105, 40 70 Z" fill="#FDE2C8" stroke="#242044" stroke-width="5"/>
    <ellipse cx="170" cy="115" rx="14" ry="18" fill="#FFFFFF" stroke="#242044" stroke-width="4"/>
    <!-- Paint dollops -->
    <circle cx="70" cy="65" r="16" fill="#FF5C8A"/>
    <circle cx="110" cy="45" r="16" fill="#FFD93D"/>
    <circle cx="150" cy="50" r="16" fill="#38B6FF"/>
    <circle cx="190" cy="75" r="16" fill="#48D597"/>
    <circle cx="85" cy="115" r="15" fill="#A855F7"/>
  </g>

  <!-- Crossed Brushes behind / over palette -->
  <g transform="translate(170, 210) rotate(-35)">
    <rect x="0" y="0" width="160" height="12" rx="6" fill="#B45309" stroke="#242044" stroke-width="3"/>
    <polygon points="160,-2 185,6 160,14" fill="#FF5C8A"/>
  </g>

  <!-- Inspiring Typography inside Canvas -->
  <text x="250" y="375" font-family="'Fredoka', sans-serif" font-weight="800" font-size="28" fill="#242044" text-anchor="middle">WHERE CREATIVITY</text>
  <text x="250" y="420" font-family="'Fredoka', sans-serif" font-weight="800" font-size="28" fill="#FF5C8A" text-anchor="middle">COMES TO LIFE</text>
  <text x="250" y="460" font-family="'Nunito', sans-serif" font-weight="700" font-size="16" fill="#716C88" text-anchor="middle">Safe • Joyful • Child-Centered</text>

  <!-- Decorative Sparkles -->
  <polygon points="250,55 254,67 266,71 254,75 250,87 246,75 234,71 246,67" fill="#FFD93D"/>
  <circle cx="105" cy="120" r="6" fill="#FF5C8A"/>
  <circle cx="395" cy="130" r="8" fill="#38B6FF"/>
</svg>