<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Artwork Wandered Off | Little Canvas</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="canonical" href="https://littlecanvas.example.com/404.html">

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">

  <!-- Sticky Navbar -->
  <header class="header-main" id="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="brand-logo">
        <div class="brand-icon"><i data-lucide="palette"></i></div>
        <span>Little<span class="text-gradient-pink">Canvas</span></span>
      </a>

      <div class="nav-actions">
        <button class="theme-toggle-btn" aria-label="Toggle Theme"><i data-lucide="moon"></i></button>
        <button class="rtl-toggle-btn" aria-label="Toggle Right-To-Left Layout" title="Toggle RTL">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3 4 7l4 4"/>
          <path d="M4 7h16"/>
          <path d="m16 21 4-4-4-4"/>
          <path d="M20 17H4"/>
        </svg>
      </button>
        <a href="index.html" class="btn-toy btn-pink btn-sm">Home</a>
      </div>
    </div>
  </header>

  <!-- 404 Content -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4rem 1.5rem; position: relative; overflow: hidden;">
    <div class="blob blob-pink" style="top: 10%; left: 15%;"></div>
    <div class="blob blob-yellow" style="bottom: 15%; right: 20%;"></div>

    <div style="max-width: 600px; position: relative; z-index: 2;">
      <div style="font-family: var(--font-display); font-size: clamp(6rem, 15vw, 10rem); font-weight: 800; line-height: 0.9; color: var(--border); text-shadow: 6px 6px 0 var(--yellow), 12px 12px 0 var(--primary);">
        404
      </div>

      <div style="font-size: 3rem; margin: 1.5rem 0 1rem 0;">🎨 🖌️ 🐾</div>

      <h1 style="font-size: clamp(1.8rem, 3vw, 2.5rem); margin-bottom: 1rem;">
        Oops! This Artwork <span class="text-gradient-rainbow">Wandered Off</span>.
      </h1>

      <p style="color: var(--muted); font-size: 1.15rem; margin-bottom: 2.5rem; line-height: 1.6;">
        It looks like this canvas was painted over or strayed off the gallery wall! Don't worry, there is plenty of creative magic back at our home studio.
      </p>

      <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <a href="index.html" class="btn-toy btn-pink"><i data-lucide="home"></i> Back to Home</a>
        <a href="classes.html" class="btn-toy btn-yellow"><i data-lucide="compass"></i> Explore Classes</a>
      </div>
    </div>
  </main>

  <footer style="text-align: center; padding: 2rem; font-size: 0.9rem; color: var(--muted); border-top: 2px solid var(--border-light);">
    © 2026 Little Canvas Studio. All rights reserved.
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
